name: Zefame Automated Submissions

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  run-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome and Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Dependencies
        run: |
          pip install undetected-chromedriver selenium

      - name: Run Views Task with Virtual Display
        run: |
          xvfb-run --auto-servernum python run_single.py views
