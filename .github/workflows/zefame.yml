name: Zefame Automated Submissions

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: zefame-cloud-runner
  cancel-in-progress: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome and Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Dependencies
        run: |
          pip install undetected-chromedriver selenium requests

      - name: Run Multi-Service Automation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_RUNTIME_SECONDS: 18000
        run: |
          xvfb-run --auto-servernum python -u zefame_automation.py
