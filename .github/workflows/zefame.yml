name: Zefame Automated Submissions

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: zefame-cloud-runner
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome and Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Dependencies
        run: |
          pip install undetected-chromedriver selenium requests

      - name: Run Multi-Service Automation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_RUNTIME_SECONDS: 14400
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -ac -nolisten tcp" python -u zefame_automation.py

      - name: Auto-Relay Next Runner
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "
          import os, requests
          token = os.environ.get('GH_PAT')
          repo = os.environ.get('GITHUB_REPOSITORY')
          if token and repo:
              url = f'https://api.github.com/repos/{repo}/actions/workflows/zefame.yml/dispatches'
              headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
              res = requests.post(url, headers=headers, json={'ref': 'main'})
              print(f'Relay dispatch status: {res.status_code}')
          "
